# Default: observe only; no chassis frames, including shutdown frames.
receive_only: true
can_interface: can0
imu_can_interface: can1
imu_node_id: 31
imu_auto_start: true
use_imu_heading: true
# On startup, rotate in place in both directions to identify the IMU yaw sign.
auto_imu_calibration: false
imu_yaw_sign: 1
imu_calibration_speed: 0.30
imu_calibration_angle: 0.17453292519943295  # 10 degrees per direction
imu_calibration_min_angle: 0.05235987755982989  # 3 degrees minimum observed motion
imu_calibration_settle_time: 0.30
imu_calibration_phase_timeout: 3.0
# Rotation from sensor axes to base_link axes, roll/pitch/yaw in radians.
imu_mount_rpy: [0.0, 0.0, 0.0]
imu_orientation_variance: 0.01
imu_gyro_variance: 0.0004
imu_accel_variance: 0.04
device_type: 225
device_node: 1
auto_initialize: false
disable_on_shutdown: true
use_stamped_cmd_vel: true
command_rate: 50.0
command_timeout: 0.30
max_linear_speed: 1.0
max_angular_speed: 2.0
# Four fixed drive wheels: skid steering. SI units; engineering initial values.
motion_track_width: 0.535
motion_wheelbase: 0.420
# Feedforward = 1 + k * (wheelbase / track_width)^2; k needs surface calibration.
motion_skid_compensation: 0.5
motion_linear_speed: 0.10
motion_angular_speed: 0.20
motion_heading_gain: 1.8
motion_yaw_rate_gain: 0.2
motion_angle_tolerance: 0.017453292519943295  # 1 degree
motion_distance_gain: 0.8
motion_distance_tolerance: 0.01
motion_timeout: 120.0
service_timeout: 1.20
heartbeat_timeout: 1.50
remote_feedback: false
sensor_feedback: false
driver_motion_feedback: true
driver_status_feedback: true
odom_source: velocity
# Required only for wheel_mileage mode: calibrate, do not guess physical geometry.
effective_track_width: 0.0
odom_frame: odom
base_frame: base_link
publish_tf: true
pose_variance_xy: 0.05
pose_variance_yaw: 0.10
twist_variance_linear: 0.02
twist_variance_angular: 0.05
